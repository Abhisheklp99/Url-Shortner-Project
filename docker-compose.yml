services:
  postgres:
    image: postgres:17
    container_name: postgres_db

    restart: always

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: myURLShortener
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: